version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"  # Map container's 3000 to host's 3001 to avoid conflict
    environment:
      - NODE_ENV=development
      - DB_HOST=db  # Keep this as 'db' for container-to-container communication
      - DB_PORT=5432  # Keep this as 5432 for internal container communication
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=myapp
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db
    entrypoint: >
      sh -c "npm install && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173" # Vite uses port 5173 by default
    environment:
      - VITE_API_URL=http://localhost:3001/api
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - api
    entrypoint: >
      sh -c "npm install && npm run dev"

  db:
    image: postgres:14-alpine
    ports:
      - "5434:5432"  # Changed from 5432:5432 to use 5434 on host
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=myapp
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
